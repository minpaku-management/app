<!DOCTYPE html>
<html lang="ja">
<head>
  <script>window.MM_API_URL = "https://script.google.com/macros/s/AKfycbyJEscB8_1h4PCF7aoppzqzLxMZ9q-lRc6EcaSrkhUHSS5Pl7zXHOjSEDyOtDogoBcRVg/exec";</script>
  <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minpaku Management</title>
  <style>
  :root {
    --navy: #1F3864;
    --blue: #2E5C8A;
    --ink: #1E2430;
    --ink-2: #4A5363;
    --ink-3: #7A8394;
    --line: #DDE2EA;
    --line-2: #EEF1F5;
    --bg: #F4F6F9;
    --card: #FFFFFF;
    --fy-now: #FCE4D6;
    --fy-prev: #DCE6F1;
    --diff: #EDEDED;
    --good: #2E7D32;
    --good-bg: #E3F1E4;
    --bad: #B3261E;
    --bad-bg: #FBE3E1;
    --warn: #8A5A00;
    --warn-bg: #FFF3D6;
    --input: #FFF8E1;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .num, td.n, th.n { font-variant-numeric: tabular-nums; }

  /* ---------- layout：左サイドバー ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--navy); color: #fff; display: flex; flex-direction: column; gap: 18px;
    padding: 18px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; line-height: 1.25; }
  .brand small { display: block; font-weight: 400; opacity: .6; font-size: 11px; margin-top: 2px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: #fff; color: var(--navy); display: grid; place-items: center; font-size: 15px; flex: none; }
  .side-controls { display: grid; gap: 4px; }
  .side-controls label { font-size: 11px; opacity: .65; margin-top: 6px; }
  .side-controls select, .side-controls input[type=date] {
    font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.08); color: #fff; min-height: 34px; width: 100%; color-scheme: dark;
  }
  .side-controls select option { color: var(--ink); }
  .nav { display: grid; gap: 2px; }
  .nav .grp { font-size: 11px; opacity: .5; padding: 12px 10px 4px; letter-spacing: .04em; }
  .nav .tab {
    font: inherit; font-size: 13px; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border: 0; border-radius: 7px; background: none; color: rgba(255,255,255,.78); cursor: pointer;
  }
  .nav .tab svg { width: 17px; height: 17px; flex: none; pointer-events: none; opacity: .85; }
  .nav .tab span { pointer-events: none; }
  .nav .tab:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav .tab.on { background: rgba(255,255,255,.16); color: #fff; font-weight: 700; }
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 13px; padding: 7px 14px; min-height: 34px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #244C74; }
  .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
  .btn.small { padding: 3px 9px; min-height: 26px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }

  main { min-width: 0; width: 100%; max-width: 1440px; padding: 24px 28px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin: 4px 0 16px; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head .meta { color: var(--ink-3); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .sub { color: var(--ink-3); font-size: 12px; margin: 0 0 12px; }
  .grid { display: grid; gap: 12px; }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1360px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 1200px) { .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }

  /* ---------- KPI ---------- */
  .kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: #fff; }
  .kpi .label { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .kpi .big { font-size: 26px; font-weight: 700; margin: 2px 0 0; letter-spacing: -.01em; }
  .kpi .big small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
  .kpi .rows { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; color: var(--ink-2); }
  .kpi .rows span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .bar { height: 6px; border-radius: 3px; background: var(--line-2); margin-top: 8px; overflow: hidden; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 3px; }
  .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3); }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .chip.up { background: var(--good-bg); color: var(--good); }
  .chip.down { background: var(--bad-bg); color: var(--bad); }
  .chip.flat { background: var(--line-2); color: var(--ink-3); }
  .chip.future { background: #E8EEF7; color: var(--blue); }

  .alerts { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .alerts li { padding: 9px 12px; border-radius: 8px; border-left: 4px solid; font-size: 13px; }
  .alerts .high { background: var(--bad-bg); border-color: var(--bad); }
  .alerts .mid { background: var(--warn-bg); border-color: #E0A800; }
  .alerts .info { background: #EEF3FA; border-color: var(--blue); }
  .empty { color: var(--ink-3); font-size: 13px; padding: 8px 0; }

  /* ---------- tables ---------- */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 5px 8px; white-space: nowrap; }
  thead th { background: var(--blue); color: #fff; font-weight: 600; position: sticky; top: 0; }
  td.n, th.n { text-align: right; }
  td.c { text-align: center; }
  td.lbl { background: #F2F2F2; font-weight: 600; }
  td.fy-now { background: var(--fy-now); font-weight: 600; }
  td.fy-prev { background: var(--fy-prev); font-weight: 600; }
  td.fy-diff, tr.diff td.n { background: var(--diff); font-weight: 600; }
  tr.prev td.n { color: #1A3F99; }
  tr.total td { font-weight: 700; background: #F6F8FB; }
  td.future, th.future { background-image: repeating-linear-gradient(135deg, rgba(46,92,138,.06) 0 6px, transparent 6px 12px); }
  td.pos { color: var(--good); font-weight: 700; }
  td.neg { color: var(--bad); font-weight: 700; background: var(--bad-bg); }
  td.muted, span.muted { color: var(--ink-3); }
  tr.hl td { background: #FFF6CC; }
  tr.floor td:first-child { box-shadow: inset 3px 0 0 var(--bad); }

  /* ---------- calendar ---------- */
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0,0,0,.08); }
  .cal-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .cal { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .cal-h { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 10px; background: #F3F5F8; font-size: 13px; font-weight: 700; }
  .cal-h span { font-weight: 500; color: var(--ink-2); font-size: 12px; }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-g div { height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .cal-g div.wd { height: auto; padding: 3px 0; font-size: 11px; color: var(--ink-3); background: #FAFBFC; }
  .cal-g div.sun { color: #C0392B; } .cal-g div.sat { color: #1F5FA8; }
  .cal-g div.fut { font-weight: 700; font-style: italic; }
  .cal-g div.pre { background: repeating-linear-gradient(135deg, #F1F1F1 0 4px, #FAFAFA 4px 8px); color: #BBB; }
  .cal.preopen .cal-h { color: var(--ink-3); }
  .cal-col-h { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }

  /* ---------- segmented ---------- */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { font: inherit; font-size: 12.5px; padding: 7px 13px; border: 0; background: none; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--navy); color: #fff; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }

  /* ---------- forms ---------- */
  fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 6px; margin: 0 0 14px; background: #fff; }
  legend { font-weight: 700; font-size: 13px; padding: 0 6px; color: var(--navy); }
  .field { display: grid; grid-template-columns: 230px 1fr; gap: 6px 14px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
  .field:last-child { border-bottom: 0; }
  .field > label { font-size: 13px; font-weight: 600; padding-top: 7px; }
  .field > label .req { color: var(--bad); margin-left: 3px; }
  .field .help { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .field input, .field select, .field textarea {
    font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid #CBD2DC; border-radius: 6px; background: var(--input); width: 100%; max-width: 420px;
  }
  .field input[readonly] { background: #F2F4F7; color: var(--ink-3); }
  .field textarea { min-height: 64px; max-width: 640px; }
  .inwrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .unit { color: var(--ink-3); font-size: 12px; }
  .sugg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: #EAF4EA; color: var(--good); border-radius: 6px; padding: 3px 4px 3px 9px; }
  .sugg.same { background: var(--line-2); color: var(--ink-3); padding-right: 9px; }
  .sticky-actions { position: sticky; bottom: 0; background: rgba(244,246,249,.95); padding: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .note { font-size: 12.5px; color: var(--ink-2); background: #EEF3FA; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }

  .drop { border: 2px dashed #B7C3D3; border-radius: var(--radius); padding: 28px; text-align: center; background: #fff; color: var(--ink-2); }
  .drop.over { border-color: var(--blue); background: #EEF3FA; }
  .steps { margin: 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); }
  .steps li { margin: 3px 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--line-2); padding: 1px 5px; border-radius: 4px; }

  /* ---------- states ---------- */
  .loading { position: fixed; inset: 0; background: rgba(244,246,249,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
  .loading.on { display: flex; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--navy); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; right: 18px; bottom: 18px; max-width: 460px; padding: 12px 16px; border-radius: 8px; color: #fff; background: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 60; display: none; font-size: 13px; }
  .toast.on { display: block; }
  .toast.err { background: var(--bad); }
  .toast.ok { background: var(--good); }

  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart text { font-size: 11px; fill: var(--ink-3); font-family: inherit; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .legend-row i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }


  /* ---------- ピックアップ在庫表 ---------- */
  .inv-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
  table.inv { border-collapse: separate; border-spacing: 0; font-size: 11px; width: max-content; }
  table.inv th, table.inv td { width: 40px; min-width: 40px; height: 28px; padding: 0 2px; text-align: center; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.inv .rh { position: sticky; left: 0; z-index: 2; width: 132px; min-width: 132px; text-align: left; padding: 0 8px; background: #F6F8FB; font-weight: 600; font-size: 12px; border-right: 1px solid var(--line); }
  table.inv .rh small { display: block; font-weight: 400; font-size: 10px; color: var(--ink-3); line-height: 1.2; }
  table.inv thead th { background: #F6F8FB; color: var(--ink-2); font-weight: 600; }
  table.inv tr.mh th { text-align: left; padding-left: 6px; color: var(--navy); font-size: 12px; }
  table.inv .mstart { border-left: 2px solid var(--navy); }
  table.inv th.sat, table.inv td.sat { color: #1A5FB4; } table.inv th.sat { background: #E7F0FB; }
  table.inv th.sun, table.inv td.sun { color: var(--bad); } table.inv th.sun { background: #FCE9E7; }
  table.inv th.today { background: var(--navy); color: #fff; }
  table.inv tr.now td, table.inv tr.ly td { height: 34px; font-weight: 700; font-size: 11px; }
  table.inv td.bk { background: var(--c); color: var(--ink); }
  table.inv td.bk.past { opacity: .55; }
  table.inv td.lyl { background: repeating-linear-gradient(135deg, var(--c) 0 4px, #fff 4px 8px); color: var(--ink-2); font-weight: 600; }
  table.inv td.pre { background: repeating-linear-gradient(135deg, #E5E5E5 0 3px, #FAFAFA 3px 6px); }
  table.inv tr.sub td { color: var(--ink-3); font-size: 10.5px; height: 22px; }
  table.inv tr.ly .rh { background: #EEF3FA; }
  table.inv tr.ly td { border-top: 2px solid var(--line); }
  table.inv tr.lyd td { height: 34px; font-size: 10.5px; color: var(--ink-2); line-height: 1.15; }
  table.inv tr.lyd td small { display: block; font-size: 10px; }
  table.inv tr.lyd td.sat { background: #E7F0FB; color: #1A5FB4; }
  table.inv tr.lyd td.sun { background: #FCE9E7; color: var(--bad); }
  table.inv tr.ms td i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: #B7791F; }
  .lyl-sw { background: repeating-linear-gradient(135deg, #F8CBAD 0 3px, #fff 3px 6px) !important; }
  .pre-sw { background: repeating-linear-gradient(135deg, #E5E5E5 0 3px, #FAFAFA 3px 6px) !important; }

  /* ---------- レート表の手数料バー ---------- */
  .feebar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2.4fr); gap: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .feebar > div { padding: 10px 14px; border-right: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .feebar > div:last-child { border-right: 0; }
  .feebar span { font-size: 11px; color: var(--ink-3); }
  .feebar b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .feebar small { font-size: 11px; color: var(--ink-2); line-height: 1.45; }
  @media (max-width: 1100px) { .feebar { grid-template-columns: repeat(2, minmax(0, 1fr)); } .feebar .wide { grid-column: 1 / -1; border-top: 1px solid var(--line-2); } .feebar > div:nth-child(2) { border-right: 0; } }

  /* ---------- マスタ：販売チャネル ---------- */
  .field.wide { grid-template-columns: minmax(0, 1fr); }
  .field > div { min-width: 0; }
  fieldset { min-width: 0; }
  table.ch-table td, table.ch-table th { vertical-align: middle; }
  table.ch-table input[type=text], table.ch-table input[type=number], table.ch-table select { font: inherit; font-size: 13px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); min-height: 32px; }
  table.ch-table input[type=checkbox] { width: 18px; height: 18px; }

  /* ---------- 施策記録 ---------- */
  .mform { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 14px; align-items: start; }
  .mform > label { font-size: 13px; font-weight: 600; padding-top: 7px; }
  .mform .req { color: var(--bad); margin-left: 3px; }
  .mform input, .mform select, .mform textarea { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); min-height: 34px; width: 100%; }
  .mform textarea { min-height: 60px; max-width: 640px; }
  .mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mlist li { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line-2); }
  .mlist li:last-child { border-bottom: 0; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* ---------- データ取込の頻度 ---------- */
  .cadence .when { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 999px; padding: 3px 12px; font-size: 13px; margin-bottom: 8px; }
  .cadence .when.m { background: #7B5EA7; }
  .cadence .period { display: inline-block; background: var(--input); border: 1px solid #E8D9A8; border-radius: 6px; padding: 1px 8px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .cadence .when small { font-weight: 400; opacity: .85; font-size: 11px; }


  /* ---------- レートカレンダー ---------- */
  .rc-row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  .rc-row > label { font-size: 13px; font-weight: 600; }
  .rc-row input[type=date], .rc-row input[type=text], .rc-row select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #CBD2DC; border-radius: 6px; background: var(--input); min-height: 34px; }
  .rc-row input[type=text] { width: 100%; max-width: 420px; }
  .rc-wds { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
  .rc-wds label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .rc-econ { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .rc-months { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .rc-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .rc-g .wd { text-align: center; font-size: 11px; color: var(--ink-3); padding: 2px 0; }
  .rc-g .wd.sun { color: var(--bad); } .rc-g .wd.sat { color: #1A5FB4; }
  .rc-d { position: relative; min-height: 50px; border-radius: 6px; background: #F6F8FB; padding: 3px 4px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; border: 1.5px solid transparent; font-variant-numeric: tabular-nums; }
  .rc-d:hover { border-color: var(--navy); }
  .rc-d .n { font-size: 10.5px; color: var(--ink-3); }
  .rc-d .n { display: flex; justify-content: space-between; gap: 2px; }
  .rc-d .n i { font-style: normal; color: var(--bad); margin-left: 3px; margin-right: auto; }

<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <span class="logo" aria-hidden="true">M</span>
        <span>Minpaku Management<small>運営管理ダッシュボード</small></span>
      </div>

        <label for="property">施設</label>
        <select id="property" aria-label="施設を選ぶ"></select>
        <label for="asOf">基準日</label>

      </div>
      <nav class="nav" id="tabs" aria-label="画面の切り替え"></nav>
      <div class="side-foot">

    <main id="content"></main>
  </div>
  <div class="loading" id="loading"><div class="spinner" aria-label="読み込み中"></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
(function () {
  'use strict';

  /* =========================================================
   * 状態
   * ======================================================= */
  var S = {
    boot: null, propertyId: null, asOf: null, dash: null, tab: 'summary',
    rateChannel: '', daily: null, measureDraft: null, confirmDel: null, rateMetric: 'shown', calFy: 'both', inferred: null, draft: null, log: null, editingId: null
  };
  var TABS = [
    ['summary', 'サマリー', '分析'], ['monthly', '月次実績'], ['pnl', '収支（推計）'], ['calendar', '稼働カレンダー'], ['pickup', 'ピックアップ'],
    ['ratecal', 'レートカレンダー', '販売'], ['plan', '料金案（来期）'], ['rates', 'レート表'], ['comp', '競合料金'], ['measures', '施策記録'], ['master', 'マスタ登録', '設定'], ['import', 'データ取込']
  ];
  var ICON = {
    summary: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    monthly: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    pickup: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    pnl: '<circle cx="12" cy="12" r="9"/><path d="M8.5 7.5L12 12l3.5-4.5M12 12v5M9 13h6M9 15.5h6"/>',
    rates: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    master: '<path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/>',
    plan: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 17.5l5.5-5.5 1.5 1.5-5.5 5.5H9z"/>',
    ratecal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M10 13.5l2 2.5 2-2.5M12 16v3M10.5 17h3"/>',
    comp: '<path d="M3 20h18"/><path d="M6 16v-5M10 16V7M14 16v-8M18 16v-3"/><circle cx="10" cy="4.5" r="1.5"/>',
    measures: '<path d="M9 4h9a2 2 0 0 1 2 2v14l-4-3-4 3V6"/><path d="M4 8h5M4 12h5M4 16h5"/>',
    import: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'
  };
  var LINE_COLORS = ['#1F3864', '#2A9D8F', '#E76F51', '#7B5EA7', '#8AB17D', '#C9184A'];

  /* =========================================================
   * サーバー呼び出し（google.script.run を Promise で包む）
   * ======================================================= */
  // 画面からは rpc(パスコード, 操作名, 引数) だけを呼ぶ。パスコードはこの端末に覚えておく
  var CODE_KEY = 'mm_code';
  function savedCode() { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } }
  function storeCode(c) { try { if (c) localStorage.setItem(CODE_KEY, c); else localStorage.removeItem(CODE_KEY); } catch (e) {} }
  function rawCall(name, args) {
    // 外に置いた画面（GitHub Pages など）では MM_API_URL に Apps Script のURLが入っている → fetch で呼ぶ
    if (window.MM_API_URL) {
      return fetch(window.MM_API_URL, {
        method: 'POST',
        // text/plain にすると事前確認（プリフライト）が要らず、Apps Script でも受け取れる
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ code: S.code || '', name: name, args: args || [] }),
        credentials: 'omit', // Googleのログイン情報を送らない＝会社用URLへの書き換えが起きない
        redirect: 'follow'
      }).then(function (r) {
        if (!r.ok) throw new Error('サーバーにつながりませんでした（' + r.status + '）');
        return r.json();
      }, function () {
        throw new Error('サーバーにつながりませんでした。通信状況を確認して、もう一度試してください。');
      }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || '不明なエラー');
        return j.result;
      });
    }
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); }).rpc(S.code || '', name, args);
    });
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var name = String(fn).replace(/^api_/, '');
    if (name === 'importAirhostCsv') name = 'importCsv';
    return rawCall(name, args).catch(function (e) {
      var m = errMsg(e);
      if (/^AUTH/.test(m) || /AUTH:/.test(m)) { storeCode(''); S.code = ''; showLogin(m.replace(/^.*?AUTH(_SETUP)?:\s*/, '')); }
      throw e;
    });
  }
  function showLogin(msg) {
    var el = $('login');
    if (!el) { el = document.createElement('div'); el.id = 'login'; document.body.appendChild(el); }
    el.innerHTML = '<form class="login-box" id="loginForm"><div class="login-brand">Minpaku Management</div>' +
      '<label for="loginCode">パスコード</label><input id="loginCode" type="password" autocomplete="current-password" required>' +
      '<p class="login-msg">' + esc(msg || '管理者から伝えられたパスコードを入れてください。この端末では次回から入力不要です。') + '</p>' +
      '<button class="btn primary" type="submit">開く</button></form>';
    el.className = 'on';
    busy(false);
    $('loginCode').focus();
    $('loginForm').onsubmit = function (ev) {
      ev.preventDefault();
      var c = $('loginCode').value.trim(); if (!c) return;
      S.code = c; busy(true);
      rawCall('whoami', []).then(function (r) {
        S.role = r.role; storeCode(c); el.className = ''; applyRole(); boot();
      }).catch(function (e) {
        busy(false); S.code = '';
        var m = errMsg(e).replace(/^.*?AUTH(_SETUP)?:\s*/, '');
        el.querySelector('.login-msg').textContent = m; el.querySelector('.login-msg').classList.add('err');
      });
    };
  }
  function applyRole() {
    var b = $('roleBadge');
    if (b) b.innerHTML = window.MM_NO_AUTH ? '' : (S.role === 'edit' ? '編集できます' : '閲覧のみ') + ' ・ <a href="#" id="logout">パスコードを変える</a>';
    var lo = $('logout'); if (lo) lo.onclick = function (ev) { ev.preventDefault(); storeCode(''); S.code = ''; S.role = ''; showLogin(); };
  }
  function start() {
    if (window.MM_NO_AUTH) { S.role = 'edit'; return boot(); }
    S.code = savedCode();
    if (!S.code) return showLogin();
    busy(true);
    rawCall('whoami', []).then(function (r) { S.role = r.role; applyRole(); boot(); })
      .catch(function (e) { storeCode(''); S.code = ''; showLogin(errMsg(e).replace(/^.*?AUTH(_SETUP)?:\s*/, '')); });
  }

  /* =========================================================
   * 表示用の小道具
   * ======================================================= */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function yen(n) { return n === null || n === undefined || isNaN(n) ? '—' : Math.round(n).toLocaleString('ja-JP'); }
  function man(n) { return n === null || n === undefined || isNaN(n) ? '—' : (Math.round(n / 1000) / 10).toLocaleString('ja-JP', { minimumFractionDigits: 1 }) + '万'; }
  function pct(x, d) { return x === null || x === undefined || isNaN(x) ? '—' : (x * 100).toFixed(d === undefined ? 1 : d) + '%'; }
  function pt(x) { if (x === null || x === undefined || isNaN(x)) return '—'; var v = x * 100; return (v > 0 ? '+' : '') + v.toFixed(1) + 'pt'; }
  function ratio(a, b) { return a && b ? a / b : null; }
  function signed(n) { if (n === null || n === undefined) return '—'; return (n > 0 ? '+' : '') + n; }
  function mlabel(ym) { return (+ym.slice(5, 7)) + '月'; }
  function ymlabel(ym) { return ym.slice(0, 4) + '年' + (+ym.slice(5, 7)) + '月'; }
  function chip(n, unit) {
    if (n === null || n === undefined) return '<span class="chip flat">—</span>';
    var cls = n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
    return '<span class="chip ' + cls + '">' + (n > 0 ? '+' : '') + n + (unit || '') + '</span>';
  }
  function chColor(ch) { var c = S.dash && S.dash.channelColors[ch]; return c ? c.color : '#D9D9D9'; }
  function busy(on) { $('loading').classList.toggle('on', !!on); }
  var toastTimer;
  function toast(msg, kind) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast on ' + (kind || '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast'; }, kind === 'err' ? 9000 : 4000);
  }
  function errMsg(e) { return (e && (e.message || e.toString())) || '不明なエラー'; }
  function table(head, rows, opts) {
    opts = opts || {};
    var h = '<div class="tbl-wrap"><table' + (opts.id ? ' id="' + opts.id + '"' : '') + '><thead><tr>' +
      head.map(function (c) { return '<th class="' + (c.cls || '') + '">' + c.t + '</th>'; }).join('') + '</tr></thead><tbody>';
    h += rows.join('') + '</tbody></table></div>';
    return h;
  }
  function isFutureMonth(ym) { return ym > S.asOf.slice(0, 7); }

  /* =========================================================
   * 起動
   * ======================================================= */
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      return (t[2] ? '<div class="grp">' + t[2] + '</div>' : '') +
        '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[t[0]] + '</svg><span>' + t[1] + '</span></button>';
    }).join('');
  }
  function renderPropertySelect() {
    var sel = $('property'), ps = S.boot.properties;
    sel.innerHTML = ps.length
      ? ps.map(function (p) { return '<option value="' + esc(p.id) + '"' + (p.id === S.propertyId ? ' selected' : '') + '>' + esc(p.name) + (p.status === '要確認' ? '（要確認）' : '') + '</option>'; }).join('')
      : '<option value="">施設がありません</option>';
  }
  function boot() {
    busy(true);
    return call('api_bootstrap').then(function (b) {
      S.boot = b;
      if (!S.asOf) S.asOf = b.today;
      $('asOf').value = S.asOf;

  function render() {
    renderTabs();

    var f = { summary: vSummary, monthly: vMonthly, calendar: vCalendar, pickup: vPickup, pnl: vPnl, rates: vRates, ratecal: vRateCal, plan: vPlan, comp: vComp, measures: vMeasures, master: vMaster, import: vImport }[S.tab];

  /* =========================================================

  /* =========================================================
   * 月次実績（横＝月、縦＝指標×年度）
   * ======================================================= */
  function vMonthly() {
    var d = S.dash, cur = d.kpi.current, prev = d.kpi.previous;
    var months = cur.months.map(function (m) { return m.month; });
    var hd = [{ t: '指標' }, { t: '年度' }].concat(months.map(function (m) { return { t: mlabel(m), cls: 'n' + (isFutureMonth(m) ? ' future' : '') }; })).concat([{ t: '年度計', cls: 'n' }]);
    // 年度計の前年比は「両年度とも実績がある月」だけで比べる（開業初年度などで年度計どうしを比べると過大に出るため）
    function agg(list) {
      var a = { nights: 0, sale: 0, lodging: 0, capacity: 0 };
      list.forEach(function (x) { a.nights += x.nights; a.sale += x.sale; a.lodging += x.lodging; a.capacity += x.capacity; });
      a.occ = a.capacity ? a.nights / a.capacity : 0; a.adr = a.nights ? a.sale / a.nights : null;
      a.adrLodging = a.nights ? a.lodging / a.nights : null; a.revpar = a.capacity ? a.sale / a.capacity : 0;

    var ovCur = agg(cur.months.filter(function (x, i) { return both[i]; }));
    var ovPrev = agg(prev.months.filter(function (x, i) { return both[i]; }));
    var ovN = both.filter(Boolean).length;
    function rowsFor(label, get, fmtFn, cmp) {
      var all = cur.months.concat([cur.total]), allP = prev.months.concat([prev.total]);
      var r1 = '<tr><td class="lbl" rowspan="3">' + label + '</td><td class="fy-now">FY' + d.fy + '</td>' + all.map(function (x, i) { return '<td class="n' + (i < 12 && isFutureMonth(x.month) ? ' future' : '') + '">' + (x.nights || get(x) ? fmtFn(get(x)) : '') + '</td>'; }).join('') + '</tr>';
      var r2 = '<tr class="prev"><td class="fy-prev">FY' + (d.fy - 1) + '</td>' + allP.map(function (x) { return '<td class="n">' + (x.nights || get(x) ? fmtFn(get(x)) : '') + '</td>'; }).join('') + '</tr>';
      var r3 = '<tr class="diff"><td class="fy-diff">' + (cmp === 'pt' ? '差' : '前年比') + '</td>' + all.map(function (x, i) {
        if (i === 12) { x = ovCur; allP = allP.slice(0, 12).concat([ovPrev]); }
        var a = get(x), b = get(allP[i]);

        if (!allP[i].nights && !b) return '<td class="n"></td>';
        return '<td class="n">' + (cmp === 'pt' ? pt(a - b) : pct(ratio(a, b), 0)) + '</td>';
      }).join('') + '</tr>';
      return r1 + r2 + r3;
    }
    var body = [
      rowsFor('販売額', function (x) { return x.sale; }, yen),
      rowsFor('泊数', function (x) { return x.nights; }, function (v) { return v; }),
      rowsFor('稼働率', function (x) { return x.occ; }, function (v) { return pct(v); }, 'pt'),
      rowsFor('ADR（清掃費込み）', function (x) { return x.adr; }, yen),
      rowsFor('素泊単価', function (x) { return x.adrLodging; }, yen),
      rowsFor('RevPAR', function (x) { return x.revpar; }, yen)
    ];
    var chans = {};
    cur.months.concat(prev.months).forEach(function (m) { Object.keys(m.byChannel).forEach(function (k) { chans[k] = true; }); });
    var chRows = Object.keys(chans).map(function (ch) {
      var all = cur.months.concat([cur.total]);
      return '<tr><td class="lbl"><span class="sw" style="background:' + chColor(ch) + '"></span>' + esc(ch) + '</td><td>販売額</td>' + all.map(function (x) { var c = x.byChannel[ch]; return '<td class="n">' + (c ? yen(c.sale) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr><td class="lbl"></td><td>泊数</td>' + all.map(function (x) { var c = x.byChannel[ch]; return '<td class="n">' + (c ? c.nights : '') + '</td>'; }).join('') + '</tr>' +
        '<tr><td class="lbl"></td><td>ADR（清掃費込み）</td>' + all.map(function (x) { var c = x.byChannel[ch]; return '<td class="n">' + (c ? yen(c.adr) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr><td class="lbl"></td><td>素泊単価</td>' + all.map(function (x) { var c = x.byChannel[ch]; return '<td class="n">' + (c ? yen(c.adrLodging) : '') + '</td>'; }).join('') + '</tr>' +
        '<tr class="diff"><td class="lbl"></td><td>構成比</td>' + all.map(function (x) { var c = x.byChannel[ch]; return '<td class="n">' + (c ? pct(c.share, 0) : '') + '</td>'; }).join('') + '</tr>';
    });
    return head('月次実績') +
      '<div class="note">宿泊日ベース（連泊は1泊ずつに均等に按分）。<b>ADR</b>＝販売額÷泊数で、ゲストが払った清掃費も含みます（1泊予約が多い月ほど高く出ます）。<b>素泊単価</b>＝清掃費を除いた1泊の宿泊料で、レート表のBaseと同じ物差しです。値付けの判断には素泊単価を見てください。斜線の列は基準日より先の月（先行予約）です。</div>' +
      '<div class="card"><h2>全体</h2><p class="sub">年度計の前年比・差は、両年度とも実績がある月（' + ovN + 'ヶ月）だけで比べています。</p>' + table(hd, body) + '</div>' +
      '<div class="card"><h2>チャネル別（FY' + d.fy + '）</h2>' + table([{ t: 'チャネル' }, { t: '' }].concat(hd.slice(2)), chRows) + '</div>';
  }

  /* =========================================================
   * 稼働カレンダー

  function calBox(c) {
    var wd = ['日', '月', '火', '水', '木', '金', '土'];
    var first = c.days[0].wd, cells = wd.map(function (w, i) { return '<div class="wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; });
    for (var i = 0; i < first; i++) cells.push('<div></div>');

      cells.push('<div class="' + cls + '"' + st + tip + '>' + x.day + '</div>');
    });
    return '<div class="cal' + (c.preOpen ? ' preopen' : '') + '"><div class="cal-h">' + ymlabel(c.month) +
      '<span>' + (c.preOpen ? '開業前' : c.booked + '/' + c.capacity + '泊（' + pct(c.occ) + '）') + '</span></div><div class="cal-g">' + cells.join('') + '</div></div>';

  function vCalendar() {

      '<span><span class="sw" style="background:#fff"></span>空室</span><span><b><i>太字斜体</i></b>＝これから迎える予約</span><span><span class="sw" style="background:repeating-linear-gradient(135deg,#E5E5E5 0 3px,#FAFAFA 3px 6px)"></span>開業前</span></div>';

    } else if (S.calFy === 'both') {

  /* =========================================================
   * ピックアップ（在庫表：いつ入ったか／前年同日はこの時点で入っていたか）
   * ======================================================= */
  function dayDiff(a, b) { return Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10))) / 86400000); }
  function md(ds) { return ds ? (+ds.slice(5, 7)) + '/' + (+ds.slice(8, 10)) : ''; }
  function lineChart(labels, series, marks) {
    var W = 860, H = 250, L = 34, R = 12, T = 18, B = 28, w = W - L - R, h = H - T - B;
    var max = 1;
    series.forEach(function (s) { s.values.forEach(function (v) { if (v > max) max = v; }); });
    max = Math.ceil(max / 5) * 5;
    function x(i) { return L + (labels.length < 2 ? w / 2 : i * w / (labels.length - 1)); }
    function y(v) { return T + h - v / max * h; }
    var g = '';
    for (var k = 0; k <= 5; k++) { var vv = max * k / 5; g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(vv) + '" y2="' + y(vv) + '" stroke="#EEF1F5"/><text x="' + (L - 6) + '" y="' + (y(vv) + 4) + '" text-anchor="end">' + vv + '</text>'; }
    var step = Math.max(1, Math.ceil(labels.length / 9)), lastIdx = labels.length - 1;
    labels.forEach(function (lb, i) { if ((i % step === 0 && lastIdx - i >= step / 2) || i === lastIdx) g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lb.slice(5)) + '</text>'; });
    (marks || []).forEach(function (mk, n) {
      var fi = dayDiff(labels[0], mk.date) / 7;
      if (fi < 0 || fi > lastIdx) return;
      var xx = L + fi * w / Math.max(1, lastIdx);
      g += '<line x1="' + xx + '" x2="' + xx + '" y1="' + T + '" y2="' + (T + h) + '" stroke="#B7791F" stroke-dasharray="3 3"/>' +
        '<g><title>' + esc(mk.date + '　' + mk.title) + '</title><circle cx="' + xx + '" cy="' + (T - 7) + '" r="7" fill="#B7791F"/><text x="' + xx + '" y="' + (T - 3.5) + '" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">' + (n + 1) + '</text></g>';
    });
    series.forEach(function (s) {
      var p = s.values.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
      var allZero = s.values.every(function (v) { return v === 0; });
      g += '<path d="' + p + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round"' + (allZero ? ' stroke-dasharray="6 5"' : '') + '/>';
      var last = s.values.length - 1;
      g += '<circle cx="' + x(last) + '" cy="' + y(s.values[last]) + '" r="3.5" fill="' + s.color + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月別の受注泊数の推移">' + g + '</svg>';
  }
  function invGrid(dp, measures) {
    var days = dp.days, wdn = ['日', '月', '火', '水', '木', '金', '土'];
    function wdc(w, hol) { return hol || w === 0 ? ' sun' : w === 6 ? ' sat' : ''; }
    var months = [], cur = null;
    days.forEach(function (x) { var m = x.date.slice(0, 7); if (!cur || cur.m !== m) { cur = { m: m, n: 0 }; months.push(cur); } cur.n++; });
    var mstart = {}; months.forEach(function (m) { mstart[m.m] = true; });
    function edge(x) { return x.date.slice(8) === '01' ? ' mstart' : ''; }
    var r0 = '<tr class="mh"><th class="rh">宿泊日</th>' + months.map(function (m) { return '<th colspan="' + m.n + '" class="mstart">' + ymlabel(m.m) + '</th>'; }).join('') + '</tr>';
    var r1 = '<tr><th class="rh">日</th>' + days.map(function (x) { return '<th class="d' + wdc(x.wd, x.hol) + edge(x) + (x.date === S.asOf ? ' today' : '') + '"' + (x.hol ? ' title="祝日"' : '') + '>' + (+x.date.slice(8)) + '</th>'; }).join('') + '</tr>';
    var r2 = '<tr><th class="rh">曜日</th>' + days.map(function (x) { return '<th class="w' + wdc(x.wd, x.hol) + edge(x) + '">' + (x.hol ? '祝' : wdn[x.wd]) + '</th>'; }).join('') + '</tr>';
    function bookCell(info, cls, x, extraTitle) {
      if (!info) return '<td class="' + cls + edge(x) + '"></td>';
      var tip = esc(x.date + '　' + info.channel + '　予約日 ' + info.bookedAt + '（' + info.lead + '日前）　素泊 ' + yen(info.perNight) + '円' + (extraTitle || ''));
      return '<td class="bk ' + cls + edge(x) + (info.first ? ' first' : '') + '" style="--c:' + chColor(info.channel) + '" title="' + tip + '">' + (info.first ? md(info.bookedAt) : '') + '</td>';
    }
    var rNow = '<tr class="now"><th class="rh">今年<small>基準日 ' + md(dp.asOf) + ' 時点</small></th>' + days.map(function (x) { return bookCell(x.now, x.past ? 'past' : '', x); }).join('') + '</tr>';
    var rLead = '<tr class="sub"><th class="rh">リードタイム</th>' + days.map(function (x) { return '<td class="' + edge(x) + '">' + (x.now && x.now.first ? x.now.lead : '') + '</td>'; }).join('') + '</tr>';

  function rcLevel(base, m) {

  function wireRateCal() {
    var box = $('rcMonths'); if (!box) return;
    var layer = box.getAttribute('data-layer'), ix = rcIndex(), down = false, start = null, snap = null, last = null;
    function paintDate(dt) {
      var x = ix[dt]; if (!x || !rcPaintable(x)) return;
      var p = rcPaint(), pend = rcPend(layer), sv = rcSaved(x, layer);
      var same = p.base ? (sv && sv.base === p.base && sv.minStay === p.minStay) : !sv;
      if (same) delete pend[dt]; else pend[dt] = { base: p.base, minStay: p.base ? p.minStay : 1 };
      paintCell(dt);
    }
    // なぞると「押し始めた日〜今指している日」の範囲をまとめて塗る（範囲から外れた日は元に戻す）
    function strokeTo(dt) {
      if (dt === last) return; last = dt;
      var a = start < dt ? start : dt, z = start < dt ? dt : start, pend = rcPend(layer);
      Object.keys(snap.touched).forEach(function (k) {
        if (k >= a && k <= z) return;
        if (snap.before.hasOwnProperty(k)) pend[k] = snap.before[k]; else delete pend[k];
        delete snap.touched[k]; paintCell(k);
      });
      for (var k = a; k <= z; k = addDay(k)) {
        if (!snap.touched[k]) { snap.touched[k] = true; if (pend.hasOwnProperty(k)) snap.before[k] = pend[k]; }
        paintDate(k);
      }
    }
    function addDay(d) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); }
    function paintCell(dt) {
      var x = ix[dt], el = box.querySelector('[data-rcdate="' + dt + '"]'); if (!x || !el) return;
      var tmp = document.createElement('div'); tmp.innerHTML = rcCell(x, layer); var n = tmp.firstChild;
      el.className = n.className; el.innerHTML = n.innerHTML; el.title = n.title; el.setAttribute('style', n.getAttribute('style') || '');
    }
    function refreshBar() { var pal = document.querySelector('.rc-pal'), sx = pal ? pal.querySelector('.rk-row').scrollLeft : 0; if (pal) pal.outerHTML = rcPalette(layer); var r = document.querySelector('.rc-pal .rk-row'); if (r) r.scrollLeft = sx; wirePal(); }
    box.addEventListener('pointerdown', function (e) {
      var w = e.target.closest('[data-rcwd]');
      if (w) {
        var wd = +w.getAttribute('data-rcwd'), mo = w.getAttribute('data-rcmonth');
        Object.keys(ix).forEach(function (k) { if (k.slice(0, 7) === mo && ix[k].wd === wd) paintDate(k); });
        refreshBar(); return;
      }
      var c = e.target.closest('[data-rcdate]'); if (!c) return;
      down = true; e.preventDefault();
      try { box.setPointerCapture(e.pointerId); } catch (x) {} // なぞっている間の移動と離したことを box で受ける
      start = c.getAttribute('data-rcdate'); last = null; snap = { touched: {}, before: {} };
      strokeTo(start);
    });
    box.addEventListener('pointermove', function (e) {
      if (!down) return;
      var el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest && el.closest('[data-rcdate]');
      if (c && box.contains(c)) strokeTo(c.getAttribute('data-rcdate'));
    });
    var end = function () { if (down) { down = false; refreshBar(); } };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end); box.addEventListener('lostpointercapture', end);
    function wirePal() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-rk]'), function (b) { b.onclick = function () { rcPaint().base = +b.getAttribute('data-rk'); refreshBar(); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-rkmin]'), function (b) { b.onclick = function () { rcPaint().minStay = +b.getAttribute('data-rkmin'); refreshBar(); }; });
      var u = $('btnRcUndo'); if (u) u.onclick = function () { S.pend[layer] = {}; render(); };
      var sbtn = $('btnRcSave'); if (sbtn) sbtn.onclick = function () {
        var pend = rcPend(layer), list = Object.keys(pend).sort().map(function (k) { return { date: k, base: pend[k].base, minStay: pend[k].minStay, note: '' }; });
        if (!list.length) return;
        busy(true);
        call('api_saveRates', S.propertyId, list, layer).then(function (r) {
          S.pend[layer] = {};
          toast((r.changed ? r.changed + '日の料金を保存しました' : '') + (r.removed ? (r.changed ? '・' : '') + r.removed + '日の設定を消しました' : ''), 'ok');
          return load();
        }).catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
      };
    }
    wirePal();
    var on = document.querySelector('.rc-pal .rk.on'); if (on && on.parentNode.scrollWidth > on.parentNode.clientWidth) on.parentNode.scrollLeft = on.offsetLeft - 60;
    var seed = $('btnSeedPlan');
    if (seed) seed.onclick = function () {
      var yy = seed.getAttribute('data-year'); busy(true);
      call('api_seedPlan', S.propertyId, yy + '-01-01', yy + '-12-31').then(function (x) { toast(x.changed ? x.changed + '日分を下書きにコピーしました' : 'コピーする日がありませんでした', 'ok'); return load(); })

  }
  function blankMaster() {
    var b = {}; S.boot.fields.forEach(function (f) { b[f.key] = f.default !== undefined ? f.default : ''; });
    b.channels = [{ name: '自社・直販', kind: '直販', rate: 0.036, mult: 1, discountOnCleaning: false, active: true }];
    b.id = ''; return b;
  }
  /** 編集中の施設ID。'' は新規。null は「今プルダウンで選んでいる施設」 */
  function editingId() {
    if (S.editingId !== null && S.editingId !== undefined) return S.editingId;
    return S.dash && S.dash.master ? S.dash.master.id : '';
  }
  function wireMaster() {
    var form = $('masterForm');
    form.addEventListener('input', function () { S.draft = readForm(); });
    form.addEventListener('change', function () { S.draft = readForm(); });
    form.addEventListener('click', function (e) {
      var t = e.target, ga = function (a) { return t.getAttribute ? t.getAttribute(a) : null; };
      if (ga('data-addch') || ga('data-delch') !== null || ga('data-applych') !== null || ga('data-addinf')) {
        e.preventDefault();
        S.draft = readForm();
        var list = S.draft.channels || [];
        if (ga('data-addch')) list.push({ name: '', kind: 'OTA', rate: 0.15, mult: 1, discountOnCleaning: false, active: true });
        else if (ga('data-delch') !== null) list.splice(+ga('data-delch'), 1);
        else if (ga('data-applych') !== null) { var c = list[+ga('data-applych')], iv = (S.inferred.channels || []).filter(function (x) { return x.channel === c.name; })[0]; if (iv) c.rate = iv.rate; }
        else { var nm = ga('data-addinf'), iv2 = (S.inferred.channels || []).filter(function (x) { return x.channel === nm; })[0]; list.push({ name: nm, kind: 'OTA', rate: iv2 ? iv2.rate : 0.15, mult: 1, discountOnCleaning: false, active: true }); }
        S.draft.channels = list; render();
        if (ga('data-addch')) { var ins = document.querySelectorAll('#chTable .ch-name'); if (ins.length) ins[ins.length - 1].focus(); }
        return;
      }
      var k = ga('data-apply');
      if (!k) return;
      e.preventDefault();
      var f = S.boot.fields.filter(function (x) { return x.key === k; })[0];
      $('f_' + k).value = fieldValueForInput(f, inferredFor(k));
      S.draft = readForm(); render();
    });
    $('btnAutofill').onclick = function () {
      busy(true);
      call('api_autofill', S.propertyId).then(function (r) { busy(false); S.inferred = r.inferred; S.draft = readForm(); render(); toast('実績データから読み取りました。緑の「反映」で入力欄に入ります。'); })
        .catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
    };
    $('btnApplyAll').onclick = function () {
      S.draft = readForm();
      Object.keys(INFER_KEYS).concat(['cleaningCost']).forEach(function (k) { var v = inferredFor(k); if (v !== null) S.draft[k] = v; });
      var cl = S.draft.channels || [];
      (S.inferred.channels || []).forEach(function (iv) {
        var hit = cl.filter(function (c) { return c.name === iv.channel; })[0];
        if (hit) { if (hit.kind !== '直販' || iv.rate > 0) hit.rate = iv.rate; }
        else cl.push({ name: iv.channel, kind: 'OTA', rate: iv.rate, mult: 1, discountOnCleaning: false, active: true });
      });
      S.draft.channels = cl;
      render(); toast('推定値を入力欄に入れました。内容を確認して「保存する」を押してください。');
    };
    $('btnAddOta').onclick = function () {
      S.draft = readForm(); (S.draft.channels = S.draft.channels || []).push({ name: '', kind: 'OTA', rate: 0.15, mult: 1, discountOnCleaning: false, active: true });
      render(); var ins = document.querySelectorAll('#chTable .ch-name'); if (ins.length) { ins[ins.length - 1].scrollIntoView({ block: 'center' }); ins[ins.length - 1].focus(); }
    };
    $('btnNew').onclick = function () { S.editingId = ''; S.draft = blankMaster(); S.inferred = null; render(); };
    $('btnReset').onclick = function () { S.draft = null; S.editingId = null; render(); };
    $('btnSave').onclick = function () {
      var data = readForm();
      busy(true);
      call('api_saveMaster', data).then(function (m) {
        toast('「' + m.name + '」を保存しました', 'ok');
        S.propertyId = m.id; S.draft = null; S.inferred = null; S.editingId = null;
        return boot();
      }).catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
    };
  }

  /* =========================================================
   * データ取込
   * ======================================================= */
  function vImport() {
    var log = S.log || [];
    var logTbl = log.length ? table(
      [{ t: '取込日時' }, { t: 'ファイル' }, { t: '行数', cls: 'n' }, { t: '新規', cls: 'n' }, { t: '更新', cls: 'n' }, { t: '取込後の総件数', cls: 'n' }, { t: '物件' }, { t: '新規登録の物件' }],
      log.map(function (l) { return '<tr><td>' + esc(l.at) + '</td><td>' + esc(l.file) + '</td><td class="n">' + esc(l.rows) + '</td><td class="n">' + esc(l.added) + '</td><td class="n">' + esc(l.updated) + '</td><td class="n">' + esc(l.total) + '</td><td>' + esc(l.properties) + '</td><td>' + esc(l.newProperties) + '</td></tr>'; })
    ) : '<p class="empty">まだ取り込みの記録はありません。</p>';
    // 期間は今日の日付から計算して、そのまま入れられる形で出す（先月1日〜13ヶ月先の月末）
    var td = (S.boot && S.boot.today) || S.asOf, ty = +td.slice(0, 4), tm = +td.slice(5, 7);
    function ymd(y, m, d) { return y + '/' + ('0' + m).slice(-2) + '/' + ('0' + d).slice(-2); }
    var fy = tm === 1 ? ty - 1 : ty, fm = tm === 1 ? 12 : tm - 1;
    var em = tm + 13, ey = ty + Math.floor((em - 1) / 12); em = ((em - 1) % 12) + 1;
    var eDay = new Date(Date.UTC(ey, em, 0)).getUTCDate();
    var from = ymd(fy, fm, 1), to = ymd(ey, em, eDay);
    var cadence = '<div class="card cadence"><div class="when">週1回<small>毎週月曜の朝</small></div><h2>AirHostで予約データCSVを出して、上の枠に入れる</h2>' +
      '<ol class="steps">' +
      '<li>AirHost ＞ <b>インポート＆エクスポート</b> ＞ <b>予約と日次データのエクスポート</b> を開く</li>' +
      '<li>種類：<b>予約データ</b>（「日次データ」ではない方）</li>' +
      '<li>日付カテゴリー：<b>チェックイン日</b></li>' +
      '<li>期間：<b class="period">' + from + ' 〜 ' + to + '</b><span class="muted">（今日 ' + td.replace(/-/g, '/') + ' 時点。先月1日から13ヶ月先の月末まで）</span></li>' +
      '<li>ステータス：<b>全部にチェック</b>（キャンセル・ブロックも含める）</li>' +
      '<li>物件：<b>全部</b></li>' +
      '<li>エクスポートしたCSVを、この画面の上の枠に入れて「取り込む」</li></ol>' +
      '<p class="sub">CSVを入れるのはこれだけです。同じ予約は上書きされるので、前回と期間が重なっても問題ありません。月初の確認（前月の実績・マスタの見直し）はCSVなしで行います。</p>' +
      '<p class="sub">過去の予約をAirHostでまとめて直したときだけ、期間の開始を<b>開業日</b>にして出し直してください。</p></div>';
    return '<div class="page-head"><h1>データ取込</h1><span class="meta">AirHostと自動でつながるまでは、週1回、予約データCSVを入れます</span></div>' +
      '<div class="card"><h2>CSVを入れる</h2><p class="sub">同じ予約は上書きされるので、何度入れても重複しません。個人情報（氏名・電話・メール・国籍・住所）は取り込まずに捨てます。「日次データ」のCSVは使いません（入れるとエラーで止まります）。</p>' +
      '<div class="drop" id="drop"><p style="margin:0 0 10px">ここにCSVファイルをドラッグ、または</p><input type="file" id="file" accept=".csv,text/csv"><p id="fileName" class="muted" style="margin:10px 0 0;font-size:12px"></p></div>' +
      '<div style="margin-top:12px"><button class="btn primary" id="btnImport" disabled>取り込む</button></div><div id="importResult" style="margin-top:12px"></div></div>' +
      cadence +
      '<div class="card"><h2>取込の記録</h2>' + logTbl + '</div>';
  }
  function importResultHtml(r) {
    if (!r) return '';
    return '<div class="note" style="background:var(--good-bg)"><b>取り込みました（' + esc(r.at) + '）。</b>新規 ' + r.added + '件・更新 ' + r.updated + '件（取込後の総件数 ' + r.total + '件）' +
      (r.newProperties ? '<br>新しい物件「' + esc(r.newProperties) + '」を施設マスタに登録しました。<b>「マスタ登録」で内容を確認してください。</b>' : '') +
      (r.droppedColumns ? '<br><span class="muted">取り込まなかった個人情報の列：' + esc(r.droppedColumns) + '</span>' : '') + '</div>';
  }
  function wireImport() {
    $('importResult').innerHTML = importResultHtml(S.lastImport);
    var file = null, input = $('file'), drop = $('drop');
    function pick(f) { file = f; $('fileName').textContent = f ? f.name + '（' + Math.round(f.size / 1024) + 'KB）' : ''; $('btnImport').disabled = !f; }
    input.onchange = function () { pick(input.files[0]); };
    drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = function () { drop.classList.remove('over'); };
    drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
    $('btnImport').onclick = function () {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        busy(true);
        call('api_importCsv', reader.result, file.name).then(function (r) {
          S.lastImport = r;
          $('importResult').innerHTML = importResultHtml(r);
          toast('取り込みました', 'ok');
          return call('api_importLog');
        }).then(function (log) { S.log = log; return boot(); })
          .then(function () { if (S.tab === 'import') render(); })
          .catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
      };
      reader.readAsText(file, 'UTF-8');
    };
  }

  /* =========================================================
   * 施策記録
   * ======================================================= */
  function blankMeasure() { return { id: '', date: S.asOf, category: '料金変更', channel: 'すべて', title: '', detail: '', stayFrom: '', stayTo: '', result: '' }; }
  function effCell(e) { return e ? e.stays + '件・' + e.nights + '泊<br><span class="muted">' + (e.perNight ? yen(e.perNight) + '円/泊' : '—') + '</span>' : '<span class="muted">これから</span>'; }
  function vMeasures() {
    var d = S.dash, list = d.measures || [], mm = S.measureDraft || blankMeasure();
    var cats = S.boot.measureCategories || [];
    var chs = ['すべて'].concat((d.rates.list || []).map(function (c) { return c.name; }));
    function inp(k, type, ph, w) { return '<input type="' + type + '" id="m_' + k + '" value="' + esc(mm[k]) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + ' style="max-width:' + (w || '420px') + '">'; }
    var form = '<form id="measureForm" onsubmit="return false"><div class="mform">' +
      '<label for="m_date">実施日<span class="req">*</span></label><div>' + inp('date', 'date', '', '180px') + '</div>' +
      '<label for="m_category">種類</label><div><select id="m_category">' + cats.map(function (c) { return '<option' + (c === mm.category ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
      '<label for="m_channel">チャネル</label><div><select id="m_channel">' + chs.map(function (c) { return '<option' + (c === mm.channel ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
      '<label for="m_title">施策<span class="req">*</span></label><div>' + inp('title', 'text', '例：12月平日を2ランク値下げ') + '</div>' +
      '<label for="m_detail">内容</label><div><textarea id="m_detail" placeholder="何を、どう変えたか">' + esc(mm.detail) + '</textarea></div>' +
      '<label for="m_stayFrom">対象の宿泊日</label><div class="inwrap">' + inp('stayFrom', 'date', '', '170px') + '<span class="unit">〜</span>' + inp('stayTo', 'date', '', '170px') + '<span class="help" style="margin:0">空欄なら全期間。入れると在庫表に印が付き、効果もその期間だけで見ます</span></div>' +
      '<label for="m_result">結果・メモ</label><div><textarea id="m_result" placeholder="あとで振り返って記入">' + esc(mm.result) + '</textarea></div>' +
      '</div><div class="sticky-actions" style="position:static;margin-top:12px"><button class="btn primary" id="btnSaveMeasure">' + (mm.id ? '更新する' : '記録する') + '</button>' + (mm.id ? '<button class="btn" id="btnCancelMeasure">編集をやめる</button>' : '') + '</div></form>';
    var rows = list.map(function (m, i) {
      var e = m.effect, diff = '';
      if (e && e.after) {
        var dn = e.after.nights - e.before.nights;
        diff = chip(dn, '泊') + (e.elapsed < e.days ? '<br><span class="muted">' + e.elapsed + '/' + e.days + '日経過</span>' : '');
      }
      var del = S.confirmDel === m.id ? '<button class="btn small danger" data-delm="' + esc(m.id) + '" data-sure="1">削除する</button>' : '<button class="btn small" data-delm="' + esc(m.id) + '">削除</button>';
      return '<tr><td class="n">' + (list.length - i) + '</td><td>' + esc(m.date) + '</td><td>' + esc(m.category) + '</td><td>' + (m.channel === 'すべて' ? 'すべて' : '<span class="sw" style="background:' + chColor(m.channel) + '"></span>' + esc(m.channel)) + '</td>' +
        '<td><b>' + esc(m.title) + '</b>' + (m.detail ? '<div class="muted" style="font-size:12px;white-space:pre-wrap">' + esc(m.detail) + '</div>' : '') + '</td>' +
        '<td>' + (m.stayFrom || m.stayTo ? esc((m.stayFrom || '') + '〜' + (m.stayTo || '')) : '<span class="muted">全期間</span>') + '</td>' +
        '<td class="n">' + (e ? effCell(e.before) : '') + '</td><td class="n">' + (e ? effCell(e.after) : '') + '</td><td class="n">' + diff + '</td>' +
        '<td style="white-space:pre-wrap;font-size:12px">' + esc(m.result) + '</td>' +
        '<td style="white-space:nowrap"><button class="btn small" data-editm="' + esc(m.id) + '">編集</button> ' + del + '</td></tr>';
    });
    var tbl = list.length ? table([{ t: 'No', cls: 'n' }, { t: '実施日' }, { t: '種類' }, { t: 'チャネル' }, { t: '施策' }, { t: '対象の宿泊日' }, { t: '実施前14日', cls: 'n' }, { t: '実施後14日', cls: 'n' }, { t: '泊数の変化', cls: 'n' }, { t: '結果・メモ' }, { t: '' }], rows)
      : '<p class="empty">まだ記録がありません。料金を変えた、割引を入れた、写真を差し替えた、などを実施した日に記録しておくと、ピックアップのグラフに印が付き、前後の予約の入り方を比べられます。</p>';
    return head('施策記録') +
      '<div class="note">実施した施策を記録します。<b>実施前14日・実施後14日</b>は、その期間に入った予約（キャンセル分を除く）の件数・泊数・素泊単価です。チャネルや対象の宿泊日を指定すると、その範囲だけで数えます。番号はピックアップのグラフの印と対応しています。</div>' +
      '<div class="card"><h2>' + (mm.id ? '施策を編集' : '施策を記録する') + '</h2>' + form + '</div>' +
      '<div class="card"><h2>これまでの施策</h2>' + tbl + '</div>';
  }
  function readMeasure() {
    var o = { id: (S.measureDraft && S.measureDraft.id) || '', property: S.dash.master.name };
    ['date', 'category', 'channel', 'title', 'detail', 'stayFrom', 'stayTo', 'result'].forEach(function (k) { o[k] = $('m_' + k).value; });
    return o;
  }
  function wireMeasures() {
    var f = $('measureForm');
    f.addEventListener('input', function () { S.measureDraft = readMeasure(); });
    f.addEventListener('change', function () { S.measureDraft = readMeasure(); });
    $('btnSaveMeasure').onclick = function () {
      var x = readMeasure(); busy(true);
      call('api_saveMeasure', x).then(function (m) { S.measureDraft = null; toast('「' + m.title + '」を記録しました', 'ok'); return load(); })
        .catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
    };
    if ($('btnCancelMeasure')) $('btnCancelMeasure').onclick = function () { S.measureDraft = null; render(); };
  }

  function wirePickup() {
    var sel = $('dailyFrom'); if (sel) sel.onchange = function () { loadDaily(sel.value + '-01'); };
    var w = $('invWrap');
    if (w) {
      var dp = S.daily || S.dash.daily, idx = 0, last = dp.days[dp.days.length - 1].date;
      if (S.asOf > dp.from && S.asOf <= last) dp.days.forEach(function (x, i) { if (x.date < S.asOf) idx = i + 1; });
      w.scrollLeft = Math.max(0, idx - 3) * 40;
    }
  }

  /* =========================================================
   * イベント
   * ======================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? (e.target.closest('button,[data-tab]') || e.target) : e.target;
    var tab = t.getAttribute && t.getAttribute('data-tab');
    if (tab) {
      if (e.preventDefault) e.preventDefault();
      if (S.pend && ((S.tab === 'ratecal' && Object.keys(S.pend.cur).length) || (S.tab === 'plan' && Object.keys(S.pend.plan).length)) && tab !== S.tab) toast('未保存の料金の変更があります（タブを戻ると残っています）', 'err');
      S.tab = tab;
      if (tab === 'import' && !S.log) { call('api_importLog').then(function (l) { S.log = l; render(); }).catch(function () {}); }
      render(); window.scrollTo(0, 0); return;
    }
    var ch = t.getAttribute && t.getAttribute('data-ch'); if (ch) { S.rateChannel = ch; render(); return; }
    var mt = t.getAttribute && t.getAttribute('data-m'); if (mt) { S.rateMetric = mt; render(); return; }
    var cf = t.getAttribute && t.getAttribute('data-cal'); if (cf) { S.calFy = cf; render(); return; }
    var al = t.getAttribute && t.getAttribute('data-align'); if (al) { loadDaily(null, al); return; }
    var ry = t.getAttribute && t.getAttribute('data-rcyear');
    if (ry) { var pr = ry.split(':'); S[pr[0] === 'plan' ? 'planYear' : 'rcYear'] = +pr[1]; render(); return; }
    var cd = e.target.closest && e.target.closest('[data-compdate]');
    if (cd) { var v = cd.getAttribute('data-compdate'); S.compDate = v && v !== S.compDate ? v : null; render(); return; }
    var em = t.getAttribute && t.getAttribute('data-editm');
    if (em) { var hit = (S.dash.measures || []).filter(function (m) { return m.id === em; })[0]; S.measureDraft = JSON.parse(JSON.stringify(hit)); render(); window.scrollTo(0, 0); return; }
    var dm = t.getAttribute && t.getAttribute('data-delm');
    if (dm) {
      if (!t.getAttribute('data-sure')) { S.confirmDel = dm; render(); return; }
      busy(true);
      call('api_deleteMeasure', dm).then(function () { S.confirmDel = null; toast('削除しました'); return load(); }).catch(function (e) { busy(false); toast(errMsg(e), 'err'); });
      return;
    }
  });
  $('property').addEventListener('change', function (e) { S.propertyId = e.target.value; S.draft = null; S.inferred = null; load(); });
  $('asOf').addEventListener('change', function (e) { if (e.target.value) { S.asOf = e.target.value; load(); } });
  $('btnReload').addEventListener('click', function () { boot(); });

  renderTabs();
  start();
})();
</script>

</body>
</html>
